services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: basic_whiteboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "basic_whiteboard"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
